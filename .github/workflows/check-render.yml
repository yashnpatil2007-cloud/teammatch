name: Check Render Status

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query Render Service and Deploys
        run: |
          echo "=== 1. SERVICE DETAILS ==="
          curl -sS -X GET "https://api.render.com/v1/services/${RENDER_SERVICE_ID}" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" | jq .

          echo -e "\n=== 2. RECENT DEPLOYS ==="
          curl -sS -X GET "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=5" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" | jq .
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
